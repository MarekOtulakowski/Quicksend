<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#17181a" media="(prefers-color-scheme: dark)">
<title>Quicksend</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="styles.css">
<script>
  try {
    var storedTheme = localStorage.getItem("quicksend-theme");
    if (storedTheme === "light" || storedTheme === "dark") document.documentElement.dataset.theme = storedTheme;
  } catch (e) {}
</script>
</head>
<body>
<header>
  <div class="brand">
    <img src="icon.svg" alt="" width="28" height="28" class="logo">
    <h1>Quicksend</h1>
  </div>
  <div class="controls">
    <div id="lang-toggle" class="toggle-group"></div>
    <div id="theme-toggle" class="toggle-group"></div>
  </div>
</header>
<main>
  <div id="pairing-root"></div>
</main>
<script type="module" src="app.js"></script>
</body>
</html>
